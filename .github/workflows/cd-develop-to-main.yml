name: CD - develop to main
on:
  push:
    branches: [develop]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: dotnet restore Video.ProcessorService.sln
      - run: dotnet build Video.ProcessorService.sln --no-restore -c Release
      - name: Test with coverage
        run: |
          dotnet test Video.ProcessorService.sln --no-build -c Release \
            --collect:"XPlat Code Coverage" --results-directory ./coverage
      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool
      - name: Merge coverage
        run: |
          reportgenerator -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:./coverage/report -reporttypes:Cobertura
      - name: Enforce 80pct
        run: |
          RATE=$(grep -oP 'line-rate="\K[0-9.]+' ./coverage/report/Cobertura.xml | head -1)
          PCT=$(echo "$RATE * 100" | bc)
          echo "Coverage: ${PCT}%"
          [ $(echo "$PCT >= 80" | bc) -eq 1 ] || { echo 'Below 80%'; exit 1; }
  promote:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Merge to main
        run: |
          git checkout main
          git merge --no-ff develop -m "chore: promote develop to main [skip ci]"
          git push origin main
      - name: Tag release
        run: |
          VERSION=$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'CD failed: develop to main',
              body: 'Run: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              labels: ['bug','ci/cd']
            });
